# Optional native Go accounts staging/production profile (activation gated).
# Anonymous production uses docker-compose.anon.yml and the canonical Go image.
#
#   Caddy (TLS/proxy)  ──►  app (native Go, single process)  ──►  db (Postgres)
#
# Usage on the host (e.g. a Hetzner CX22, EU):
#   cp .env.prod.example .env.prod   # then fill in the secrets (see docs/DEPLOY.md)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# The anonymous arcade needs none of this — it runs from the plain `docker-compose.yml`.
# This stack turns on CAT_ACCOUNTS_ENABLED=1; do not point it at real users until the
# go-live compliance checklist in docs/DEPLOY.md is satisfied.

name: cat-de-roman-esti

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cat}
      POSTGRES_USER: ${POSTGRES_USER:-cat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cat} -d ${POSTGRES_DB:-cat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GATE_SHA: ${GATE_SHA:?explicit owner-qualified 40-hex source SHA required}
        GATE_TREE_SHA256: ${GATE_TREE_SHA256:?explicit owner-qualified 64-hex source tree required}
    image: cat-de-roman-esti:accounts
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8000"
      CAT_ACCOUNTS_ENABLED: "1"
      CAT_DEBUG: "0"
      CAT_DOMAIN: ${CAT_DOMAIN:?set CAT_DOMAIN in .env.prod}
      CAT_DATABASE_URL: postgres://${POSTGRES_USER:-cat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cat}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
      FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_API_VERSION: ${FACEBOOK_API_VERSION:-}
      CAT_CONSENT_VERSION: ${CAT_CONSENT_VERSION:-2026-07-09}
      CAT_DONATE_URL: ${CAT_DONATE_URL:-}
      CAT_LEGAL_OPERATOR: ${CAT_LEGAL_OPERATOR:-}
      CAT_LEGAL_CONTACT_EMAIL: ${CAT_LEGAL_CONTACT_EMAIL:-}
      CAT_SUBMISSIONS_DIR: /data/submissions
      CAT_SESSION_TTL_SECONDS: ${CAT_SESSION_TTL_SECONDS:-7200}
      CAT_MAX_SESSIONS_PER_GAME: ${CAT_MAX_SESSIONS_PER_GAME:-1000}
      CAT_MAX_REQUEST_BYTES: ${CAT_MAX_REQUEST_BYTES:-65536}
    volumes:
      - submissions:/data/submissions
    command: ["cat-server", "-listen", "0.0.0.0:8000", "-migrate"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose:
      - "8000" # reachable only by Caddy over the compose network (no host port)
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      CAT_DOMAIN: ${CAT_DOMAIN:?set CAT_DOMAIN in .env.prod}
      TLS_EMAIL: ${TLS_EMAIL:-}
      CAT_MAX_REQUEST_BYTES: ${CAT_MAX_REQUEST_BYTES:-65536}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  submissions:
  caddy_data:
  caddy_config:
