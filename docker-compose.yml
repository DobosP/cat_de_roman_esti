# Default local Go anonymous arcade. No database, Python server or submissions.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cat-de-roman-esti:latest
    container_name: cat-de-roman-esti
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      PORT: "8000"
      CAT_ACCOUNTS_ENABLED: "0"
      CAT_CONSENT_VERSION: "${CAT_CONSENT_VERSION:-2026-07-09}"
      CAT_DONATE_URL: "${CAT_DONATE_URL:-}"
      CAT_LEGAL_OPERATOR: "${CAT_LEGAL_OPERATOR:-}"
      CAT_LEGAL_CONTACT_EMAIL: "${CAT_LEGAL_CONTACT_EMAIL:-}"
      CAT_SESSION_TTL_SECONDS: "${CAT_SESSION_TTL_SECONDS:-7200}"
      CAT_MAX_SESSIONS_PER_GAME: "${CAT_MAX_SESSIONS_PER_GAME:-1000}"
      CAT_MAX_REQUEST_BYTES: "${CAT_MAX_REQUEST_BYTES:-65536}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "--max-time", "3", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
