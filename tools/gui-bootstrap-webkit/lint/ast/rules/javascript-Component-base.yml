{
  "id": "roedu-javascript-Component-base",
  "language": "JavaScript",
  "severity": "error",
  "message": "Component-base",
  "rule": {
    "all": [
      {
        "any": [
          {
            "kind": "member_expression"
          },
          {
            "kind": "subscript_expression"
          }
        ]
      },
      {
        "regex": "^(Component|this)\\s*(\\.\\s*base|\\[\\s*[\"']base[\"']\\s*\\])$"
      }
    ]
  }
}
