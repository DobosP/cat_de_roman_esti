{
  "id": "roedu-typescript-v11-computed",
  "language": "TypeScript",
  "severity": "error",
  "message": "v11-computed",
  "rule": {
    "all": [
      {
        "kind": "subscript_expression"
      },
      {
        "regex": "\\[\\s*[\"'](forwardRef|defaultProps)[\"']\\s*\\]$"
      }
    ]
  }
}
