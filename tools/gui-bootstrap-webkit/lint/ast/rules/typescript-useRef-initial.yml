{
  "id": "roedu-typescript-useRef-initial",
  "language": "TypeScript",
  "severity": "error",
  "message": "useRef-initial",
  "rule": {
    "all": [
      {
        "kind": "call_expression"
      },
      {
        "has": {
          "field": "function",
          "regex": "(^|\\.)useRef$"
        }
      },
      {
        "has": {
          "field": "arguments",
          "regex": "^\\(\\s*\\)$"
        }
      }
    ]
  }
}
