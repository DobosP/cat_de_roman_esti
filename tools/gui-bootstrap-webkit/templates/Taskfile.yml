    function retain(ctx,evidence,phase,command,args,child,duration){if(!/^[A-Za-z][A-Za-z0-9._-]*$/.test(phase))throw Error('Unsafe bootstrap phase');const ordinal=evidence.actions.length,prefix=`.gate/${ctx.target.replaceAll(':','-')}/logs/${ctx.invocation}-bootstrap-${phase}-${ordinal}`,logs={};for(const stream of ['stdout','stderr']){const relative=`${prefix}.${stream}.log`,bytes=Buffer.from(child[stream]??''),file=outputPath(ctx,relative);fs.mkdirSync(path.dirname(file),{recursive:true});fs.writeFileSync(file,bytes,{flag:'wx'});evidence.artifacts.push(`${relative} sha256:${hash(bytes)}`);logs[`${stream}_log`]=relative;}evidence.actions.push({phase,kind:'command',command,argument_count:args.length,args_sha256:hash(JSON.stringify(args)),cwd:'.',exit_code:child.status??-1,duration_ms:duration,stdout_sha256:hash(child.stdout??''),stderr_sha256:hash(child.stderr??''),...(child.error?{error:child.error.message}:{}),...logs});}
    function invoke(ctx,evidence,phase,command,args,maxBuffer=64*1024*1024){const started=Date.now(),child=spawnSync(command,args,{cwd:ctx.root,env:process.env,encoding:'utf8',maxBuffer});retain(ctx,evidence,phase,command,args,child,Date.now()-started);if(child.stderr)process.stderr.write(child.stderr);return child;}
    function seal(ctx,evidence){evidence.finished=new Date().toISOString();const relative=`.gate/${ctx.target.replaceAll(':','-')}/bootstrap-execution.json`,bytes=Buffer.from(JSON.stringify(evidence,null,2)+'\n'),file=outputPath(ctx,relative);fs.mkdirSync(path.dirname(file),{recursive:true});fs.writeFileSync(file,bytes);return {schema:1,target:ctx.target,invocation:ctx.invocation,sha:ctx.sha,tree_sha256:ctx.tree_sha256,toolchain_digest:ctx.toolchain_digest,started:ctx.started,path:relative,sha256:hash(bytes)};}
    function evidenceArtifacts(ctx,evidence){const receipt=seal(ctx,evidence);return [...evidence.artifacts,`${receipt.path} sha256:${receipt.sha256}`];}
    function adopt(ctx,artifacts,report){for(const artifact of report.artifacts??[]){const match=/^(.+) sha256:([a-f0-9]{64})$/.exec(artifact);if(!match)throw Error('Malformed bootstrap hook artifact');const file=outputPath(ctx,match[1]);if(!fs.lstatSync(file).isFile()||hash(fs.readFileSync(file))!==match[2])throw Error('Bootstrap hook artifact mismatch');if(!artifacts.includes(artifact))artifacts.push(artifact);}}
    function checksValid(checks) {
      if (!Array.isArray(checks) || !checks.length || new Set(checks.map(item => item.name)).size !== checks.length) throw Error('Actual nonempty distinct checks required');
      for (const check of checks) if (typeof check.name !== 'string' || !['pass', 'fail'].includes(check.status) || !Number.isInteger(check.duration_ms) || check.duration_ms < 0) throw Error('Malformed bootstrap check');
    }
    /** Carry actual standalone inspection truth through the pre-install bootstrap. */
    function validateBootstrapUiAdoption(ctx, report, input) {
      const phase = validateUiAdoption(ctx.config), present = Object.hasOwn(report, 'ui_adoption');
      if (!phase) {
        if (present || report.checks.some(check => check.name === 'ui-adoption' || check.name === 'ui-staged-original')) throw Error('Active bootstrap must not carry staged UI evidence');
        return undefined;
      }
      const value = report.ui_adoption;
      const fields = (object, keys) => !!object && typeof object === 'object' && !Array.isArray(object) && Object.keys(object).length === keys.length && keys.every(key => Object.hasOwn(object,key));
      if (!present || !fields(value,['mode','status','until','source','config_sha256','legacy','selected_ui']) || value.mode !== 'staged-react' || value.status !== 'pending' || value.until !== 'S1-M2' || value.source !== 'repo:kit-config' || value.config_sha256 !== ctx.config_sha256) throw Error('Standalone pending UI evidence must bind the complete frozen configuration');
      const canonical = validateUiAdoption({ ...ctx.config, ui_adoption: { mode: value.mode, until: value.until, legacy: value.legacy } });
      if (JSON.stringify(canonical) !== JSON.stringify(phase)) throw Error('Standalone pending legacy seal differs from frozen phase');
      if (!fields(value.selected_ui,['version','archive_sha256']) || value.selected_ui.version !== input.selected_ui.version || value.selected_ui.archive_sha256 !== input.selected_ui.archive_sha256) throw Error('Standalone selected UI evidence differs from verified committed kit input');
      const actual = report.checks.filter(check => check.name === 'ui-adoption');
      if (actual.length !== 1 || actual[0].status !== 'pass' || actual[0].reason !== 'ui-staged-pending' || report.checks.some(check => check.name === 'ui-staged-original')) throw Error('Actual standalone ui-adoption inspection check and pending reason required');
      return { mode: 'staged-react', status: 'pending', until: 'S1-M2', source: 'repo:kit-config', config_sha256: ctx.config_sha256, legacy: canonical.legacy, selected_ui: { ...input.selected_ui } };
    }
    function publish(ctx, checks, artifacts, exitCode, uiAdoption) {
      checksValid(checks);
      const result = { schema: 1, target: ctx.target, status: exitCode === 0 && checks.every(item => item.status === 'pass') ? 'pass' : 'fail', sha: ctx.sha, dirty: ctx.dirty, tree_sha256: ctx.tree_sha256, toolchain_digest: ctx.toolchain_digest, versions_lock_sha256: hash(fs.readFileSync(path.join(ctx.root, 'versions.lock.json'))), parallel: ctx.parallel, started: ctx.started, finished: new Date().toISOString(), checks, csp: { stage: ctx.stage, violations: 0, legacy_violations: 0 }, budgets: {}, artifacts, ...(uiAdoption?{ui_adoption:uiAdoption}:{}) };
      const directory = path.join(ctx.root, '.gate', ctx.target.replaceAll(':', '-')); fs.mkdirSync(directory, { recursive: true }); fs.writeFileSync(path.join(directory, 'result.json'), JSON.stringify(result, null, 2) + '\n');
      process.exitCode = result.status === 'pass' ? 0 : 1; return result;
    }
    /** First sync imports no package helper: only this one checksum-verified standalone script is extracted. */
    function bootstrapKitSync() {
      const ctx = context('kit:sync'), checks = [], artifacts = [], evidence = evidenceState(ctx);
      let child, uiAdoption;
      try {
        const start = Date.now(), input = verifyInputs(ctx.root);
        checks.push({ name: 'bootstrap-kit-input', status: 'pass', duration_ms: Date.now() - start });
        const directory = path.join(ctx.root, '.gate/kit-sync/_bootstrap'); fs.mkdirSync(directory, { recursive: true });
        const script = path.join(directory, 'kit-sync.mjs'); fs.writeFileSync(script, input.script, { mode: 0o600 });
        artifacts.push(`verified-bootstrap ${input.archive} sha256:${input.archive_sha256}`);
        child = invoke(ctx,evidence,'kit-sync',process.execPath,[script]);
        const report = JSON.parse(child.stdout); checksValid(report.checks); checks.push(...report.checks);
        if (child.error || child.status !== 0 || report.status !== 'pass' || report.mode !== 'sync' || report.tag !== input.tag) throw Error('Actual standalone kit sync failed');
        uiAdoption = validateBootstrapUiAdoption(ctx, report, input);
      } catch (error) { checks.push({ name: 'bootstrap-kit-sync', status: 'fail', reason: error.message, duration_ms: 0 }); }
      return publish(ctx, checks, [...artifacts,...evidenceArtifacts(ctx,evidence)], child?.status ?? 1, uiAdoption);
    }
    /** Dependency generation before node_modules exists; repo hook must be self-contained and emit actual command evidence. */
    function bootstrapDeps() {
      const ctx = context('deps'), checks = [], artifacts = [], evidence = evidenceState(ctx), start = Date.now();
      const child = invoke(ctx,evidence,'deps','task',['--silent','repo:deps',`INVOCATION=${ctx.invocation}`]);
      try {
        const report = JSON.parse(child.stdout); checksValid(report.checks);
        if (report.schema !== 1 || report.target !== 'deps' || report.invocation !== ctx.invocation || report.sha !== ctx.sha || report.tree_sha256 !== ctx.tree_sha256 || !Array.isArray(report.actions)) throw Error('Dependency hook is empty/unbound');
        for (const required of ['npm-lock', 'go-mod-tidy']) {
          const check = report.checks.find(item => item.name === required), actions = report.actions.filter(action => action.check === required && action.kind === 'command');
          const command = required === 'npm-lock' ? 'npm' : 'go', args = required === 'npm-lock' ? ['install', '--package-lock-only', '--ignore-scripts'] : ['mod', 'tidy'];
          if (!check || (check.status === 'pass' && (!actions.length || actions.some(action => path.basename(action.command) !== command || action.args_sha256 !== hash(JSON.stringify(args)) || action.exit_code !== 0)))) throw Error(`Actual dependency command missing/false pass: ${required}`);
        }
        adopt(ctx,artifacts,report); checks.push(...report.checks);
        if (child.error || child.status !== 0) throw Error('Actual repo:deps process failed');
      } catch (error) { checks.push({ name: 'repo-deps', status: 'fail', reason: error.message, duration_ms: Date.now() - start }); }
      return publish(ctx, checks, [...artifacts,...evidenceArtifacts(ctx,evidence)], child.status ?? 1);
    }

    try { bootstrapKitSync(); } catch(error) { process.stderr.write(error.message+'\n');process.exitCode=1; }
tasks:
  _runner:
    desc: Trusted inline package locator and actual setup launcher
    internal: true
    cmds:
      - |
        node --input-type=module - '{{.TARGET}}' <<'ROEDU_RUNNER'
        {{._RUNNER_JS}}
        ROEDU_RUNNER
  setup:
    desc: Install through the explicit repo setup hook
    cmds:
      - task: _runner
        vars:
          TARGET: setup
  gate:unit:
    desc: Run generic checks and bound repo unit hook
    cmds:
      - task: _runner
        vars:
          TARGET: unit
  gate:full:
    desc: Run complete generic checks and bound repo full hook
    cmds:
      - task: _runner
        vars:
          TARGET: full
  gen:
    desc: Generate repo sources; resolution only via approved wrapper flag
    cmds:
      - task: _runner
        vars:
          TARGET: gen
  assets:sync:
    desc: Copy actual built assets into module embedfs
    cmds:
      - task: _runner
        vars:
          TARGET: assets:sync
  build:
    desc: Build actual product and delivery artifacts
    cmds:
      - task: _runner
        vars:
          TARGET: build
  image:record:
    desc: Record host-built immutable app image ID
    cmds:
      - task: _runner
        vars:
          TARGET: image
  versions:check:
    desc: Check exact versions and scoped legacy findings
    cmds:
      - task: _runner
        vars:
          TARGET: versions:check
  versions:resolve:
    desc: Internal resolver guarded by gen --resolve-versions
    cmds:
      - task: _runner
        vars:
          TARGET: versions:resolve
  kit:check:
    desc: Check actual committed kit identity; core runs fixture self-test
    cmds:
      - task: _runner
        vars:
          TARGET: kit:check
  baseline:
    desc: Capture actual live app screenshot baseline
    cmds:
      - task: _runner
        vars:
          TARGET: baseline
  legacy:freeze:
    desc: Invoke repo-owned legacy freeze hook
    cmds:
      - task: _runner
        vars:
          TARGET: legacy:freeze
  e2e:
    desc: Invoke actual repo-owned browser subset
    cmds:
      - task: _runner
        vars:
          TARGET: e2e
  perf:
    desc: Invoke actual repo-owned performance subset
    cmds:
      - task: _runner
        vars:
          TARGET: perf
  golden:capture:
    desc: S0b or app-owned golden capture; refuses until implemented
    cmds:
      - task: _runner
        vars:
          TARGET: golden:capture
  golden:verify:
    desc: S0b or app-owned golden verification; refuses until implemented
    cmds:
      - task: _runner
        vars:
          TARGET: golden:verify
  contract:refresh:
    desc: S0b or app-owned contract refresh; refuses until implemented
    cmds:
      - task: _runner
        vars:
          TARGET: contract:refresh
  deps:
    desc: Generate real dependency locks before any package helper is installed
    cmds:
      - |
        node --input-type=module <<'ROEDU_DEPS'
        {{._DEPS_JS}}
        ROEDU_DEPS
  kit:sync:
    desc: Parent-only committed kit bootstrap; extracts only verified standalone sync script
    cmds:
      - |
        node --input-type=module <<'ROEDU_KIT_SYNC'
        {{._KIT_SYNC_JS}}
        ROEDU_KIT_SYNC
  env:up:
    desc: Host wrapper owns test environment lifecycle
    cmds:
      - |
        node --input-type=module -e "throw Error('Runner has no Docker socket; trusted host wrapper full manages the test environment')"
  env:down:
    desc: Host wrapper owns test environment lifecycle
    cmds:
      - |
        node --input-type=module -e "throw Error('Runner has no Docker socket; trusted host wrapper full manages the test environment')"
