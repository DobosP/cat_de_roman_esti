{
  "id": "roedu-tsx-JSX-types",
  "language": "Tsx",
  "severity": "error",
  "message": "JSX-types",
  "rule": {
    "all": [
      {
        "any": [
          {
            "kind": "member_expression"
          },
          {
            "kind": "nested_type_identifier"
          }
        ]
      },
      {
        "regex": "^JSX\\s*\\.\\s*HTMLAttributes$"
      }
    ]
  }
}
