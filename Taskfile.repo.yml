version: "3"
silent: true
tasks:
  kit-config:
    cmds:
      - node --input-type=module -e 'process.stdout.write("{\"role\":\"consumer\",\"app\":\"cat_de_roman_esti\",\"npm_dir\":\"tools/gui-bootstrap-webkit\",\"vendor_dir\":\"frontend/vendor\",\"go_dirs\":[\"go-backend\"]}")'
  setup:
    cmds:
      - node scripts/gui-repo-hook.mjs setup '{{.INVOCATION}}'
  deps:
    cmds:
      - node scripts/gui-repo-hook.mjs deps '{{.INVOCATION}}'
  gen:
    cmds:
      - node scripts/gui-repo-hook.mjs gen '{{.INVOCATION}}'
  unit:
    cmds:
      - node scripts/gui-repo-hook.mjs unit '{{.INVOCATION}}'
  full:
    cmds:
      - node scripts/gui-repo-hook.mjs full '{{.INVOCATION}}'
  build:
    cmds:
      - node scripts/gui-repo-hook.mjs build '{{.INVOCATION}}'
  baseline:
    cmds:
      - node scripts/gui-repo-hook.mjs baseline '{{.INVOCATION}}'
  assets-sync:
    cmds:
      - node scripts/gui-repo-hook.mjs assets-sync '{{.INVOCATION}}'
  legacy-freeze:
    cmds:
      - node scripts/gui-repo-hook.mjs legacy-freeze '{{.INVOCATION}}'
  e2e:
    cmds:
      - node scripts/gui-repo-hook.mjs e2e '{{.INVOCATION}}'
  perf:
    cmds:
      - node scripts/gui-repo-hook.mjs perf '{{.INVOCATION}}'
