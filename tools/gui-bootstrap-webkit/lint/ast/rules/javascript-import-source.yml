{
  "id": "roedu-javascript-import-source",
  "language": "JavaScript",
  "severity": "error",
  "message": "import-source",
  "rule": {
    "all": [
      {
        "kind": "string"
      },
      {
        "inside": {
          "any": [
            {
              "kind": "import_statement"
            },
            {
              "kind": "export_statement"
            }
          ],
          "stopBy": "neighbor",
          "field": "source"
        }
      }
    ]
  }
}
