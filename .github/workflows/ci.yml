name: CI

# Run the same checks the repo holds to locally, on demand:
#   - fixture is valid (validate_fixture.py — the committed KG content gate)
#   - pytest green (engine + loader + BFF, all offline against the bundled fixture)
#   - ruff clean (lint)
#   - the SPA type-checks (tsc --noEmit), builds (vite), and lints (eslint)
#
# Everything runs offline against the bundled fixture — no live ro_data_server, no
# secrets. The web deps are installed PINNED via constraints.txt so CI matches deploy.

# Run from Actions > Run workflow only when requested or needed for a specific change.
on:
  workflow_dispatch:
    inputs:
      run_rust:
        description: Run retained Rust research qualification (not the selected release runtime)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-go:
    name: Go arcade and native accounts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-bookworm
        env:
          POSTGRES_DB: cat_native_test
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fixture -d cat_native_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production-contract oracle
        run: python -m pip install -c constraints.txt -e ".[dev,web]"
      - name: Check reviewed private content export
        run: |
          python -c "import unicodedata; assert unicodedata.unidata_version == '15.0.0'"
          PYTHONPATH=. python scripts/export_go_content.py --check
      - name: Format, vet and race-test native backend
        working-directory: go-backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Build standalone native binary
        working-directory: go-backend
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../build/cat-server ./cmd/cat-server
      - name: Qualify native account database and shared authentication
        run: |
          go -C shared-go/authcore test -race ./...
          go -C shared-go/authcore vet ./...
          go -C go-backend test -race ./internal/accounts -accounts.database 'postgres://fixture:disposable-ci-fixture@127.0.0.1:5432/cat_native_test?sslmode=disable'
          go -C go-backend test -race ./internal/httpapi -arcade.database 'postgres://fixture:disposable-ci-fixture@127.0.0.1:5432/cat_native_test?sslmode=disable'
      - name: Differential HTTP journeys against Django
        run: PYTHONPATH=. python scripts/check_go_parity.py --binary build/cat-server
      - name: Build canonical Go release container
        run: docker build -f Dockerfile -t cat-native-go:ci .
      - name: Verify canonical Go container
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' cat-native-go:ci)" = "10001:10001"
          container=$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1::8000 cat-native-go:ci)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          test "$status" = healthy
          address=$(docker port "$container" 8000/tcp)
          curl --fail --silent "http://$address/" | python -c 'import sys; assert "<!doctype html>" in sys.stdin.read().lower()'
          curl --fail --silent -X POST "http://$address/api/wordgames/intrusul/games?seed=17" | python -c 'import json,sys; d=json.load(sys.stdin); assert len(d["tiles"])==4 and not d["won"]'
          docker exec "$container" sh -c '! command -v python && ! command -v python3'
      - uses: actions/upload-artifact@v4
        with:
          name: cat-native-go
          path: build/cat-server
          retention-days: 7

  native-rust:
    name: Rust research (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_rust }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qualified Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production-contract oracle
        run: python -m pip install -c constraints.txt -e ".[dev,web]"
      - name: Check reviewed private content export
        run: |
          python -c "import unicodedata; assert unicodedata.unidata_version == '15.0.0'"
          PYTHONPATH=. python scripts/export_go_content.py --check
      - name: Format, lint and test native backend
        working-directory: rust-backend
        run: |
          cargo +1.98.1 fmt --all -- --check
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings
          cargo +1.98.1 test --locked
      - name: Build standalone native binary
        working-directory: rust-backend
        run: cargo +1.98.1 build --locked --release --bin cat-rust-server
      - name: Differential HTTP journeys against Django
        run: PYTHONPATH=. python scripts/check_go_parity.py --runtime rust --binary rust-backend/target/release/cat-rust-server
      - name: Build standalone nonroot container
        run: docker build -f rust-backend/Dockerfile -t cat-native-rust:ci .
      - name: Verify standalone container
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' cat-native-rust:ci)" = "10001:10001"
          container=$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1::8080 cat-native-rust:ci)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          test "$status" = healthy
          address=$(docker port "$container" 8080/tcp)
          curl --fail --silent "http://$address/" | python -c 'import sys; assert "<!doctype html>" in sys.stdin.read().lower()'
          curl --fail --silent -X POST "http://$address/api/wordgames/intrusul/games?seed=17" | python -c 'import json,sys; d=json.load(sys.stdin); assert len(d["tiles"])==4 and not d["won"]'
          docker exec "$container" sh -c '! command -v python && ! command -v python3'
      - uses: actions/upload-artifact@v4
        with:
          name: cat-native-rust
          path: rust-backend/target/release/cat-rust-server
          retention-days: 7

  native-go-browser:
    name: Selected Go browser
    needs: [native-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline fixture oracle
        run: python -m pip install -c constraints.txt -e ".[web]"
      - uses: actions/download-artifact@v4
        with:
          name: cat-native-go
          path: build
      - name: Restore native executable permission
        run: chmod +x build/cat-server
      - name: Install and build current SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Standalone native game journeys (desktop + mobile)
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-browser-failures-go
          path: frontend/test-results/
          retention-days: 7

  native-rust-browser:
    name: Rust research browser (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_rust }}
    needs: [native-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline fixture oracle
        run: python -m pip install -c constraints.txt -e ".[web]"
      - uses: actions/download-artifact@v4
        with:
          name: cat-native-rust
          path: rust-backend/target/release
      - name: Restore native executable permission
        run: chmod +x rust-backend/target/release/cat-rust-server
      - name: Install and build current SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Retained Rust journeys (desktop + mobile)
        working-directory: frontend
        run: npx playwright test --config playwright.rust.config.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-browser-failures-rust
          path: frontend/test-results/
          retention-days: 7

  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = Unicode-15 producer/reference; 3.14 = Python compatibility lane.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (dev + web, web pinned via constraints.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev,web]"

      - name: Validate KG fixture (content gate)
        run: python scripts/validate_fixture.py

      - name: Validate curated games pack (content gate)
        run: python scripts/validate_games_pack.py

      - name: Lint (ruff)
        run: ruff check

      - name: Tests (pytest, offline fixture — accounts OFF / stateless)
        run: pytest -q

      - name: Tests (accounts ON — Google login + saved progress, sqlite)
        run: CAT_ACCOUNTS_ENABLED=1 CAT_DEBUG=1 pytest -q tests/accounts

  frontend:
    name: frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Frontend contracts
        run: npm test

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (tsc --noEmit && vite build)
        # vite.config.ts emits into ../cat_de_roman_esti/web/static; assert the SPA
        # shell landed (mirrors the Dockerfile's build-time check).
        run: |
          npm run build
          test -f ../cat_de_roman_esti/web/static/index.html
          ls ../cat_de_roman_esti/web/static/assets/*.js >/dev/null
